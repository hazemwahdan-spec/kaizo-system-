[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaizo-system"
version = "1.1.1"
description = "KAIZO FastAPI deployment adapter"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0; sys_platform != 'emscripten'",
  "psycopg[binary]==3.2.3; sys_platform != 'emscripten'",
  "psycopg==3.2.3; sys_platform == 'emscripten',
  "PyJWT[crypto]>=2.10,<3",
]

[tool.setuptools]
# Explicitly package only the deployed adapter and runtime package.
# This prevents the root-level test and feature directories from being
# treated as installable packages by automatic discovery.
py-modules = ["app"]
packages = ["longitudinal"]

[dependency-groups]
dev = [
  "workers-py",
  "workers-runtime-sdk",
]
