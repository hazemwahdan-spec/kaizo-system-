name: FEAT-066-070 Competition Runtime Integration

on:
  pull_request:
    paths:
      - "backend/competition_runtime.py"
      - "backend/test_competition_runtime.py"
      - "backend/main.py"
      - ".github/workflows/feat-066-070-competition-runtime.yml"

jobs:
  competition-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Compile runtime
        run: python -m py_compile backend/competition_runtime.py backend/main.py
      - name: Run FEAT-066..070 tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/test_competition_runtime.py
