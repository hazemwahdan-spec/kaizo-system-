name: PACK-B Production Evidence
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  pack-b-production-red-team:
    # This job writes test entities to the live production digital twin.
    # Never run a mutating production red-team sequence from an unmerged PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute independent PACK-B production red team
        run: bash pack-b-production-redteam.sh

      - name: Persist PASS evidence record
        if: success() && github.event_name != 'pull_request'
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p docs/governance
          cat > docs/governance/DB-04-PRODUCTION-PERSISTENCE-PASS-${RUN_ID}.md <<EOF
# DB-04 Production Persistence PASS

- Workflow: PACK-B Production Evidence
- Run ID: ${RUN_ID}
- Source commit: ${SHA}
- Runtime: https://kaizo-core-engine-production.up.railway.app
- Test: independent production red-team persistence sequence
- Result: PASS
- Evidence scope: digital-twin production write, read-back, version-conflict guard, missing-input guard, coach-authority guard, and audit-log verification.
- Secrets: none recorded.
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/DB-04-PRODUCTION-PERSISTENCE-PASS-${RUN_ID}.md
          git commit -m "evidence: DB-04 production persistence PASS [skip ci]"
          git push
