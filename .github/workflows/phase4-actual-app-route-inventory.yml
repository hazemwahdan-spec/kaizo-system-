name: Phase 4 Actual Core Route Inventory

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/phase4-actual-app-route-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-app-route-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest httpx
      - name: Compile backend and route inventory test
        run: |
          python -m compileall -q backend
          python -m pytest -q backend/test_phase4_actual_app_route_inventory.py
