name: Coach Durable Decision Cycle Closure

on:
  pull_request:
    branches: [main]
    paths:
      - "productization/coach_decision_cycles.py"
      - "productization/product_api.py"
      - "productization/test_product_api.py"
      - "backend/persistence.py"
      - ".github/workflows/coach-decision-cycle-closure.yml"
  push:
    branches: [fix/coach-durable-decision-cycles]
    paths:
      - "productization/coach_decision_cycles.py"
      - "productization/product_api.py"
      - "productization/test_product_api.py"
      - "backend/persistence.py"
      - ".github/workflows/coach-decision-cycle-closure.yml"

permissions:
  contents: read

jobs:
  durable-decision-cycle:
    runs-on: ubuntu-latest
    env:
      KAIZO_IDENTITY_MODE: development
      KAIZO_PERSISTENCE_MODE: memory
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install --upgrade pip && python -m pip install "fastapi==0.115.6" "pydantic==2.10.4" "httpx==0.28.1" "pytest>=8,<9" "PyJWT[crypto]>=2.10,<3" "psycopg[binary]==3.2.3"
      - name: Compile changed Coach and persistence modules
        run: python -m compileall -q productization backend
      - name: Validate Coach decision, adaptation, ownership and read-back
        run: python -m pytest -q productization/test_product_api.py productization/test_identity.py productization/test_product_api_security_regression.py
