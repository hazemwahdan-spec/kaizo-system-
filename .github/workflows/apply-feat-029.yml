name: Apply FEAT-029
on:
  push:
    branches: [feat-029-progression-regression]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/apply_feat029.py
      - run: |
          rm -f scripts/apply_feat029.py .github/workflows/apply-feat-029.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py backend/persistence.py backend/test_feat_029_progression_regression.py .github/workflows/feat-029-validation.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(FEAT-029): progression regression rules [skip ci]"
          git push
