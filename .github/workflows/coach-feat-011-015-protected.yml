name: Coach FEAT-011-025 Protected Workflow

on:
  pull_request:
    paths:
      - "productization/coach_assessment_workflow.py"
      - "productization/coach_problem_workflow.py"
      - "productization/coach_diagnostic_workflow.py"
      - "productization/coach_decision_workflow.py"
      - "productization/test_coach_decision_workflow_api.py"
      - "productization/test_coach_decision_workflow_postgres.py"
      - "productization/test_coach_diagnostic_workflow_api.py"
      - "productization/test_coach_diagnostic_workflow_postgres.py"
      - "productization/test_coach_problem_workflow_api.py"
      - "productization/test_coach_problem_workflow_postgres.py"
      - "productization/product_api.py"
      - "productization/test_coach_assessment_workflow_api.py"
      - "productization/test_coach_assessment_workflow_postgres.py"
      - "frontend/app.js"
      - "frontend/test_product_ui_contract.py"
      - ".github/workflows/coach-feat-011-015-protected.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-assessment-kpi-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaizo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaizo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KAIZO_IDENTITY_MODE: oidc
      KAIZO_PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaizo_test
      PYTHONPATH: backend:.
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi==0.115.6" "pydantic==2.10.4" "httpx==0.28.1" "pytest>=8,<9" "PyJWT[crypto]>=2.10,<3" "psycopg[binary]==3.2.3"
      - name: Compile protected Coach workflow
        run: python -m compileall -q productization backend
      - name: Set up Node for Coach UI syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Coach UI syntax and protected API integration
        run: |
          node --check frontend/app.js
          python -m pytest -q frontend/test_product_ui_contract.py
      - name: Verify Bearer identity, ownership, and UI-facing API contract
        run: python -m pytest -q productization/test_coach_assessment_workflow_api.py
      - name: Verify PostgreSQL persistence, ownership, and atomic audit rollback
        run: python -m pytest -q productization/test_coach_assessment_workflow_postgres.py
      - name: Verify protected FEAT-016 problem statement API and PostgreSQL persistence
        run: |
          python -m pytest -q productization/test_coach_problem_workflow_api.py
          python -m pytest -q productization/test_coach_problem_workflow_postgres.py
      - name: Verify protected FEAT-018..020 Coach diagnostic APIs
        run: |
          python -m pytest -q productization/test_coach_diagnostic_workflow_api.py
          python -m pytest -q productization/test_coach_diagnostic_workflow_postgres.py
      - name: Verify protected FEAT-021..025 candidate, rationale, comparison, review and decision APIs
        run: |
          python -m pytest -q productization/test_coach_decision_workflow_api.py
          python -m pytest -q productization/test_coach_decision_workflow_postgres.py
      - name: Verify OpenAPI exposes protected FEAT-011..025 routes only
        run: |
          python - <<'PY'
          from main import app
          paths = set(app.openapi()["paths"])
          required = {
              "/api/v1/product/coach/athletes/{athlete_id}/assessments",
              "/api/v1/product/coach/athletes/{athlete_id}/assessments/{assessment_id}",
              "/api/v1/product/coach/kpi-definitions",
              "/api/v1/product/coach/kpi-definitions/{kpi_id}",
              "/api/v1/product/coach/athletes/{athlete_id}/kpi-captures",
              "/api/v1/product/coach/athletes/{athlete_id}/kpi-captures/{capture_id}",
              "/api/v1/product/coach/athletes/{athlete_id}/assessments/{assessment_id}/evidence",
              "/api/v1/product/coach/athletes/{athlete_id}/state-snapshots",
              "/api/v1/product/coach/athletes/{athlete_id}/state-snapshots/{snapshot_id}",
              "/api/v1/product/coach/athletes/{athlete_id}/problem-statements",
              "/api/v1/product/coach/athletes/{athlete_id}/problem-statements/{problem_id}",
              "/api/v1/product/coach/athletes/{athlete_id}/problem-statements/{problem_id}/cause-context",
              "/api/v1/product/coach/athletes/{athlete_id}/problem-statements/{problem_id}/diagnoses",
              "/api/v1/product/coach/athletes/{athlete_id}/diagnoses/{diagnosis_id}/decision-candidates",
              "/api/v1/product/coach/athletes/{athlete_id}/decision-candidates/{candidate_id}/rationales",
              "/api/v1/product/coach/athletes/{athlete_id}/diagnoses/{diagnosis_id}/decision-comparisons",
              "/api/v1/product/coach/athletes/{athlete_id}/decision-candidates/{candidate_id}/coach-review",
              "/api/v1/product/coach/athletes/{athlete_id}/decision-candidates/{candidate_id}/decision-record",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"PROTECTED_COACH_OPENAPI_PATHS_MISSING: {missing}")
          retired = (
              "/api/v1/assessments",
              "/api/v1/problem-statements",
              "/api/v1/diagnoses",
              "/api/v1/decision-candidates",
              "/api/v1/training-plans",
              "/api/v1/training-sessions",
              "/api/v1/kpis",
              "/api/v1/state-snapshots",
          )
          exposed = sorted(
              path for path in paths
              if any(path == prefix or path.startswith(prefix + "/") for prefix in retired)
          )
          if exposed:
              raise SystemExit(f"UNSCOPED_LEGACY_OPENAPI_PATHS_EXPOSED: {exposed}")
          print(f"PROTECTED_COACH_OPENAPI_PASS: {len(required)} routes present; legacy routes hidden")
          PY
