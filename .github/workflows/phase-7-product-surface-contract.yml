name: Phase 7 Product Surface Contract

on:
  push:
    branches: [phase-7-product-surface-runtime]
  pull_request:
    branches: [main]

jobs:
  product-surface-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies\n        run: python -m pip install pytest\n      - name: Validate product surface contract
        run: python -m pytest productization/test_product_surface_contract.py -q
