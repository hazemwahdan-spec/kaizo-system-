name: KAIZO V1.1 Commercial Production Evidence

on:
  workflow_dispatch:

jobs:
  production-evidence:
    runs-on: ubuntu-latest
    env:
      KAIZO_PRODUCTION_BASE_URL: https://kaizo-core-engine-production.up.railway.app
      KAIZO_OIDC_BEARER_TOKEN: ${{ secrets.KAIZO_OIDC_BEARER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secret without exposing it
        shell: bash
        run: |
          if [ -z "${KAIZO_OIDC_BEARER_TOKEN}" ]; then
            echo "MISSING_SECRET: KAIZO_OIDC_BEARER_TOKEN"
            exit 1
          fi
          echo "Secret present: KAIZO_OIDC_BEARER_TOKEN"

      - name: Verify live OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/oidc.json -w "%{http_code}" \
            -H "Authorization: Bearer ${KAIZO_OIDC_BEARER_TOKEN}" \
            "${KAIZO_PRODUCTION_BASE_URL}/api/v1/product/auth/oidc/verify")
          test "$code" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/oidc.json'))
          assert d.get("authenticated") is True
          print("OIDC_LIVE_VERIFICATION: PASS")
          PY

      - name: Verify production health
        run: |
          curl -fsS "${KAIZO_PRODUCTION_BASE_URL}/api/v1/health" >/tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get("status") == "Online"
          print("PRODUCTION_HEALTH: PASS")
          PY

      - name: Record governed evidence boundary
        shell: bash
        run: |
          echo "Commercial production evidence workflow is configured."
          echo "No token value is printed or persisted."
          echo "Full activation remains gated until live positive/negative RBAC, tenant, intervention, audit and independent retest evidence is collected."
