name: KAIZO V1.1 Commercial Production Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - feat/phase4-core-resource-authorization

jobs:
  production-evidence:
    runs-on: ubuntu-latest
    env:
      # Canonical target is recorded in Gate A decision register (commit 974a999).
      # Railway remains historical/secondary for this workstream.
      KAIZO_PRODUCTION_BASE_URL: https://kaizo-system.fastapicloud.dev
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      # Must match KAIZO_OIDC_AUDIENCE on the selected deployment.
      AUTH0_AUDIENCE: https://api.kaizo.system
    steps:
      - uses: actions/checkout@v4

      - name: Validate required Auth0 configuration without exposing values
        shell: bash
        run: |
          set -euo pipefail
          for name in AUTH0_DOMAIN AUTH0_CLIENT_ID AUTH0_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "MISSING_CONFIGURATION: $name"
              exit 1
            fi
          done
          echo "Required Auth0 configuration is present."

      - name: Request short-lived Auth0 access token
        shell: bash
        run: |
          set -euo pipefail
          # Accept either a bare Auth0 domain or a pasted URL; remove accidental
          # scheme, trailing slash, and whitespace without printing secret values.
          auth0_domain="$(printf '%s' "${AUTH0_DOMAIN}" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g; s#^https?://##; s#/.*$##; s#:[0-9]+$##; s#/*$##')"
          if [[ ! "$auth0_domain" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "INVALID_AUTH0_DOMAIN_FORMAT: set AUTH0_DOMAIN to kaizo-system.us.auth0.com (domain only)"
            exit 1
          fi
          response=$(curl -fsS --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 \
            -X POST "https://${auth0_domain}/oauth/token" \
            -H "content-type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${AUTH0_CLIENT_ID}" \
            --data-urlencode "client_secret=${AUTH0_CLIENT_SECRET}" \
            --data-urlencode "audience=${AUTH0_AUDIENCE}")
          token=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))')
          if [ -z "$token" ]; then
            echo "AUTH0_TOKEN_ISSUANCE_FAILED: response did not contain access_token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "KAIZO_OIDC_BEARER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "AUTH0_TOKEN_ISSUANCE: PASS (token value masked and not persisted)"

      - name: Verify live OIDC identity
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/oidc.json -w "%{http_code}" \
            -H "Authorization: Bearer ${KAIZO_OIDC_BEARER_TOKEN}" \
            "${KAIZO_PRODUCTION_BASE_URL}/api/v1/product/auth/oidc/verify")
          if [ "$code" != "200" ]; then
            echo "OIDC_LIVE_VERIFICATION: FAIL (HTTP $code)"
            # Print only the bounded verifier error detail; never print the bearer token,
            # Auth0 client secret, response headers, or the complete response document.
            python - <<'PY'
          import json
          try:
              payload = json.load(open('/tmp/oidc.json', encoding='utf-8'))
              detail = str(payload.get("detail", "no JSON detail returned"))
          except Exception:
              detail = "non-JSON error response"
          print("OIDC_VERIFIER_DIAGNOSTIC:", detail[:240])
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          d=json.load(open('/tmp/oidc.json'))
          assert d.get("verified") is True
          assert d.get("source") == "oidc_jwt"
          print("OIDC_LIVE_VERIFICATION: PASS")
          PY

      - name: Verify invalid bearer is rejected by production OIDC endpoint
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/oidc-negative.json -w "%{http_code}" \
            -H "Authorization: Bearer kaizo-phase4-invalid-token" \
            "${KAIZO_PRODUCTION_BASE_URL}/api/v1/product/auth/oidc/verify")
          if [ "$code" != "401" ]; then
            echo "OIDC_INVALID_BEARER_REJECTION: FAIL (expected HTTP 401, got $code)"
            echo "Response body omitted."
            exit 1
          fi
          echo "OIDC_INVALID_BEARER_REJECTION: PASS (HTTP 401)"

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 5 --max-time 15 "${KAIZO_PRODUCTION_BASE_URL}/api/v1/health" >/tmp/health.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get("status") == "Online"
          print("PRODUCTION_HEALTH: PASS")
          PY

      - name: Record governed evidence boundary
        shell: bash
        run: |
          echo "Short-lived Auth0 access token was requested at runtime and masked."
          echo "No token value is printed or persisted as a repository artifact."
          echo "This workflow checks live OIDC verification and health only; it does not prove route-level RBAC, tenant isolation, guardian consent, durable audit, or full commercial activation."
          echo "Full commercial activation remains gated until live positive/negative authorization and independent retest evidence is collected."
