name: FEAT-052-055 Audit Trace Integration
on:
  pull_request:
    paths:
      - backend/audit_trace_runtime.py
      - backend/test_audit_trace_runtime.py
      - backend/main.py
      - backend/persistence.py
  push:
    branches:
      - "feat/integrate-052-055-audit-trace"
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q backend/test_audit_trace_runtime.py
