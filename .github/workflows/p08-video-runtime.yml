name: P08 Video Match Analysis Runtime Evidence

on:
  push:
    paths:
      - "video/**"
      - ".github/workflows/p08-video-runtime.yml"
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static runtime
        run: |
          python3 -m http.server 8080 --directory video >/tmp/p08.log 2>&1 &
          echo $! >/tmp/p08.pid
          sleep 2
      - name: HTTP smoke test
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/ | grep -q "KAIZO VIDEO / MATCH ANALYSIS"
          curl -fsS http://127.0.0.1:8080/app.js | grep -q "DEMO / NON-AUTHORITATIVE"
          curl -fsS http://127.0.0.1:8080/app.js | grep -q "Coach interpretation"
      - name: Governance checks
        run: |
          set -e
          test -s video/index.html
          test -s video/app.js
          test -s video/styles.css
          test -s video/Dockerfile
          grep -q "computer vision" video/README.md
          grep -q "P13" video/README.md
          grep -q "P14" video/README.md
      - name: Stop runtime
        if: always()
        run: kill $(cat /tmp/p08.pid) 2>/dev/null || true