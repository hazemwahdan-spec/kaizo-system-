name: FEAT-047-050 Knowledge Runtime Integration
on:
  pull_request:
    paths:
      - backend/knowledge_runtime.py
      - backend/test_knowledge_runtime.py
      - backend/main.py
      - backend/persistence.py
  push:
    branches:
      - "feat/integrate-047-050-knowledge-runtime"
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q backend/test_knowledge_runtime.py
