name: FEAT-057-060 Evidence Safety Integration
on:
  pull_request:
    paths:
      - backend/evidence_safety_runtime.py
      - backend/test_evidence_safety_runtime.py
      - backend/main.py
      - backend/persistence.py
  push:
    branches:
      - "feat/integrate-057-060-evidence-kpi"
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q backend/test_evidence_safety_runtime.py
