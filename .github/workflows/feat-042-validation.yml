name: FEAT-042 Validation
on:
  pull_request:
    paths:
      - backend/digital_twin_state_update.py
      - backend/test_feat_042_digital_twin_state_update.py
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest test_feat_042_digital_twin_state_update.py
        working-directory: backend
