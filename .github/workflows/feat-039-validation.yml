name: FEAT-039 Validation
on:
  pull_request:
    paths:
      - "backend/progress_state_update.py"
      - "backend/test_feat_039_progress_state_update.py"
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Acceptance
        working-directory: backend
        run: python -m unittest test_feat_039_progress_state_update.py
