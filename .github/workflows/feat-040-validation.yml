name: FEAT-040 Validation
on:
  pull_request:
    paths: [backend/next_decision_trigger.py, backend/test_feat_040_next_decision_trigger.py]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest test_feat_040_next_decision_trigger.py
        working-directory: backend
