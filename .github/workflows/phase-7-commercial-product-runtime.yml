name: Phase 7 Commercial Product Runtime

on:
  push:
    branches: [phase-7-commercial-product-runtime, feat/coach-product-action-traceability]
  pull_request:
    branches: [main, feat/coach-roster-ui-integration, feat/coach-training-groups, feat/coach-athlete-lifecycle, feat/coach-athlete-decision-history, feat/coach-home-dashboard, feat/coach-today-priority-queue, feat/coach-athlete-workflow-navigation, feat/coach-decision-cycle-workspace, feat/coach-action-history, feat/coach-audit-review]

jobs:
  product-runtime:
    runs-on: ubuntu-latest
    env:
      KAIZO_IDENTITY_MODE: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install fastapi pydantic pytest httpx2 PyJWT[crypto]
      - name: Validate FEAT-006 Coach home dashboard
        if: ${{ hashFiles('productization/test_coach_home_dashboard.py') != '' }}
        run: python -m pytest productization/test_coach_home_dashboard.py frontend/test_product_ui_contract.py -q
      - name: Validate FEAT-007 Coach priority queue
        if: ${{ hashFiles('productization/test_coach_priority_queue.py') != '' }}
        run: python -m pytest productization/test_coach_priority_queue.py productization/test_coach_priority_queue_api.py -q
      - name: Validate FEAT-008 Coach athlete workflow navigation
        if: ${{ hashFiles('frontend/test_feat_008_navigation_contract.py') != '' }}
        run: python -m pytest frontend/test_feat_008_navigation_contract.py -q
      - name: Validate FEAT-009 Coach decision workspace
        if: ${{ hashFiles('productization/test_coach_decision_workspace.py') != '' }}
        run: python -m pytest productization/test_coach_decision_workspace.py frontend/test_feat_009_decision_workspace_contract.py -q
      - name: Validate FEAT-010 Coach action history
        if: ${{ hashFiles('productization/test_coach_action_history.py') != '' }}
        run: python -m pytest productization/test_coach_action_history.py frontend/test_feat_010_action_history_contract.py -q
      - name: Validate FEAT-054 Coach audit review
        if: ${{ hashFiles('productization/test_coach_audit_review.py') != '' }}
        run: python -m pytest productization/test_coach_audit_review.py -q
      - name: Validate FEAT-055 Coach product-action traceability
        if: ${{ hashFiles('productization/test_coach_product_action_traceability.py') != '' }}
        run: python -m pytest productization/test_coach_product_action_traceability.py -q
      - name: Validate commercial product runtime
        run: python -m pytest productization/test_product_surface.py productization/test_runtime_adapter.py productization/test_product_surface_contract.py productization/test_product_api.py productization/test_identity.py productization/test_product_api_security_regression.py productization/test_coach_roster_security.py productization/test_coach_groups_security.py productization/test_coach_athlete_lifecycle.py productization/test_coach_athlete_decision_history.py frontend/test_product_ui_contract.py -q
