name: Feature Quality Runtime Validation

on:
  pull_request:
    paths:
      - "backend/feature_runtime.py"
      - "backend/test_feature_runtime.py"
      - "backend/main.py"
      - "docs/product/KAIZO-FEATURE-QUALITY-TECHNICAL-EVIDENCE-BASELINE-V1.md"
  push:
    branches: ["main"]

jobs:
  feature-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q test_feature_runtime.py
