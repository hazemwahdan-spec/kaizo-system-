name: Persistence Adapter Validation

on:
  push:
    branches:
      - main
      - feat/kaizo-persistence-adapter
  pull_request:
    branches:
      - main

jobs:
  validate-persistence-adapter:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaizo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaizo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      KAIZO_PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaizo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run persistence integration test
        run: PYTHONPATH=. python tests/test_persistence_integration.py
      - name: Import application with PostgreSQL mode
        run: python -c "import main; print('KAIZO PostgreSQL import OK; persistence mode=', main.persistence.mode())"
      - name: Run FEAT-001 athlete acceptance tests
        run: PYTHONPATH=. python test_feat_001_athletes.py
      - name: Run FEAT-011 measurement persistence acceptance tests
        run: PYTHONPATH=. python test_feat_011_measurements.py
      - name: Run FEAT-012 athlete assessment acceptance tests
        run: PYTHONPATH=. python test_feat_012_record_assessment.py
      - name: Run FEAT-013 KPI definition and capture acceptance tests
        working-directory: backend
        run: PYTHONPATH=. python test_feat_013_kpi.py
      - name: Run FEAT-014 assessment evidence attachment acceptance tests
        run: PYTHONPATH=. python test_feat_014_assessment_evidence.py
      - name: Run FEAT-015 baseline/current-state snapshot acceptance tests
        run: PYTHONPATH=. python test_feat_015_state_snapshot.py
      - name: Run FEAT-016 structured problem statement acceptance tests
        run: PYTHONPATH=. python test_feat_016_problem_statement.py
      - name: Run FEAT-017 problem library selection acceptance tests
        run: PYTHONPATH=. python -m unittest test_feat_016_problem_statement.FEAT017ProblemLibrarySelectionTests

      - name: Run FEAT-046 audit spine acceptance tests
        run: PYTHONPATH=. python -m unittest test_feat_011_measurements.FEAT046AuditSpineTests

      - name: Run FEAT-051 evidence spine acceptance tests
        run: PYTHONPATH=. python test_feat_051_evidence.py

      - name: Run FEAT-041 digital twin state acceptance tests
        run: PYTHONPATH=. python test_feat_041_digital_twin.py

      - name: Run FEAT-056 safety/evidence guardrail acceptance tests
        run: PYTHONPATH=. python test_feat_056_safety_guardrails.py
