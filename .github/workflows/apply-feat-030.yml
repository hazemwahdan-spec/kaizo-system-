name: Apply FEAT-030
on:
  push:
    branches: [feat-030-clean]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/apply_feat030.py
      - run: |
          rm -f scripts/apply_feat030.py .github/workflows/apply-feat-030.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py backend/persistence.py backend/test_feat_030_session_constraints_notes.py .github/workflows/feat-030-validation.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(FEAT-030): session constraints and notes"
          git push
