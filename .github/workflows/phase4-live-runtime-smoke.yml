name: Phase 4 Live Runtime Smoke

# This is an acceptance probe for an already-deployed candidate.
# Do not run it on pull_request: the live host is intentionally not changed by CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: https://kaizo-system.fastapicloud.dev
    steps:
      - name: Fetch deployed OpenAPI contract with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kaizo-openapi.json"
          status="000"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS --connect-timeout 10 --max-time 25 -o "$output" -w "%{http_code}" "$BASE_URL/openapi.json" || true)"
            if [[ "$status" == "200" ]]; then
              break
            fi
            echo "OpenAPI attempt $attempt returned HTTP $status"
            sleep 5
          done
          if [[ "$status" != "200" ]]; then
            echo "LIVE_OPENAPI_FAILED: $BASE_URL/openapi.json returned HTTP $status after bounded retries"
            exit 1
          fi
          python - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              schema = json.load(f)
          assert schema.get("info", {}).get("title") == "KAIZO Core Engine API", schema.get("info")
          assert schema.get("info", {}).get("version") == "2.0.0", schema.get("info")
          paths = schema.get("paths", {})
          required = {
              "/api/v1/health",
              "/api/v1/evidence",
              "/api/v1/problem-library",
              "/api/v1/product/coach/athletes",
              "/api/v1/training-workflow/feat-037/retest",
              "/api/v1/state-cycle/feat-042/digital-twin-state",
              "/api/v1/audit/logs",
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f"LIVE_OPENAPI_MISSING_PROTECTED_PATHS: {missing}")
          retired_prefixes = (
              "/api/v1/athletes",
              "/api/v1/assessments",
              "/api/v1/problem-statements",
              "/api/v1/diagnoses",
              "/api/v1/decision-candidates",
              "/api/v1/training-plans",
              "/api/v1/training-sessions",
              "/api/v1/training-dosages",
              "/api/v1/problem-library/selections",
              "/api/v1/kpis",
              "/api/v1/state-snapshots",
              "/api/v1/digital-twin",
              "/api/v1/decision/loop",
              "/api/v1/decision/adapt",
              "/api/v1/rules/evaluate",
              "/api/v1/safety/evaluate",
              "/api/v1/knowledge/ingest",
          )
          exposed = sorted(
              path for path in paths
              if any(path == prefix or path.startswith(prefix + "/")
                     for prefix in retired_prefixes)
          )
          if exposed:
              raise SystemExit(f"LIVE_LEGACY_ROUTES_STILL_EXPOSED_IN_OPENAPI: {exposed}")
          print(f"LIVE_OPENAPI_PASS: {len(paths)} paths; protected Coach contract present; retired routes hidden")
          PY

      - name: Verify legacy Core routes fail closed
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            "/api/v1/athletes/kaizo-live-security-probe" \
            "/api/v1/decision/loop"; do
            status="$(curl -sS --connect-timeout 10 --max-time 25 -X GET -o /dev/null -w "%{http_code}" "$BASE_URL$path" || true)"
            if [[ "$status" != "410" ]]; then
              echo "LIVE_LEGACY_ROUTE_RETIREMENT_FAILED: $path returned HTTP $status (expected 410)"
              exit 1
            fi
            echo "LIVE_LEGACY_ROUTE_RETIREMENT_PASS: $path returned HTTP 410"
          done

      - name: Verify audit logs fail closed without verified identity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "$BASE_URL/api/v1/audit/logs" || true)"
          case "$status" in
            401|403)
              echo "LIVE_AUDIT_DENIAL_PASS: unauthenticated /api/v1/audit/logs returned HTTP $status"
              ;;
            503)
              echo "LIVE_AUDIT_DENIAL_HOLD: HTTP 503 is fail-closed but does not prove the intended authorization policy"
              exit 1
              ;;
            *)
              echo "LIVE_AUDIT_DENIAL_FAILED: unauthenticated /api/v1/audit/logs returned HTTP $status (expected 401 or 403; 503 is not proof)"
              exit 1
              ;;
          esac

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kaizo-health.json"
          status="$(curl -sS --connect-timeout 10 --max-time 25 -o "$output" -w "%{http_code}" "$BASE_URL/api/v1/health" || true)"
          if [[ "$status" != "200" ]]; then
            echo "LIVE_HEALTH_FAILED: $BASE_URL/api/v1/health returned HTTP $status"
            cat "$output" 2>/dev/null || true
            exit 1
          fi
          python - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              body = json.load(f)
          assert body.get("status") == "Online", body
          print("LIVE_HEALTH_PASS:", json.dumps(body, sort_keys=True))
          PY
