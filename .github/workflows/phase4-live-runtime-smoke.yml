name: Phase 4 Live Runtime Smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/phase4-live-runtime-smoke.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/phase4-live-runtime-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Gate A designates FastAPI Cloud as canonical production. Do not silently
      # substitute Railway; deployment identity must be resolved explicitly.
      BASE_URL: https://kaizo-system.fastapicloud.dev
    steps:
      - name: Fetch deployed OpenAPI contract with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kaizo-openapi.json"
          status="000"
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -sS --connect-timeout 10 --max-time 25 -o "$output" -w "%{http_code}" "$BASE_URL/openapi.json" || true)"
            if [[ "$status" == "200" ]]; then break; fi
            echo "OpenAPI attempt $attempt returned HTTP $status"
            sleep 5
          done
          if [[ "$status" != "200" ]]; then
            echo "LIVE_OPENAPI_FAILED: $BASE_URL/openapi.json returned HTTP $status after bounded retries"
            exit 1
          fi
          python - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              schema = json.load(f)
          assert schema.get("info", {}).get("title") == "KAIZO Core Engine API", schema.get("info")
          assert schema.get("info", {}).get("version") == "2.0.0", schema.get("info")
          paths = schema.get("paths", {})
          required = {
              "/api/v1/health",
              "/api/v1/evidence",
              "/api/v1/problem-statements/{problem_id}/diagnosis",
              "/api/v1/diagnoses/{diagnosis_id}/decision-candidates",
              "/api/v1/decision-candidates/{candidate_id}/rationale",
              "/api/v1/features/feat-029/progression-regression-rules",
              "/api/v1/knowledge-runtime/feat-047/provenance",
              "/api/v1/audit/logs",
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f"LIVE_OPENAPI_MISSING_PHASE4_PATHS: {missing}")
          print(f"LIVE_OPENAPI_PASS: {len(paths)} paths; required Phase 4 paths present")
          PY

      - name: Verify public health endpoint remains available
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/kaizo-health.json"
          status="$(curl -sS --connect-timeout 10 --max-time 25 -o "$output" -w "%{http_code}" "$BASE_URL/api/v1/health" || true)"
          if [[ "$status" != "200" ]]; then
            echo "LIVE_HEALTH_FAILED: $BASE_URL/api/v1/health returned HTTP $status"
            cat "$output" 2>/dev/null || true
            exit 1
          fi
          python - "$output" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              body = json.load(f)
          print("LIVE_HEALTH_PASS:", json.dumps(body, sort_keys=True))
          PY

      - name: Verify anonymous evidence list and detail are denied
        shell: bash
        run: |
          set -euo pipefail
          for path in "/api/v1/evidence" "/api/v1/evidence/phase4-anonymous-denial-probe"; do
            status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "$BASE_URL$path" || true)"
            case "$status" in
              401|403|503) echo "LIVE_ANONYMOUS_DENIAL_PASS: GET $path returned HTTP $status" ;;
              *) echo "LIVE_ANONYMOUS_DENIAL_FAILED: GET $path returned HTTP $status (404 is not authorization proof)"; exit 1 ;;
            esac
          done

      - name: Verify anonymous evidence writes are denied
        shell: bash
        run: |
          set -euo pipefail
          payload='{"evidence_id":"phase4-anonymous-write-probe","subject_type":"rule","subject_id":"global-rule","evidence_level":"E1","status":"UNVERIFIED","claim":"anonymous denial probe","verified_by":"forged-client-identity"}'
          status="$(curl -sS --connect-timeout 10 --max-time 25 -H "Content-Type: application/json" -d "$payload" -o "$RUNNER_TEMP/kaizo-evidence-write.json" -w "%{http_code}" "$BASE_URL/api/v1/evidence" || true)"
          case "$status" in
            401|403|503) echo "LIVE_ANONYMOUS_WRITE_DENIAL_PASS: POST /api/v1/evidence returned HTTP $status" ;;
            *) echo "LIVE_ANONYMOUS_WRITE_DENIAL_FAILED: POST /api/v1/evidence returned HTTP $status"; cat "$RUNNER_TEMP/kaizo-evidence-write.json" || true; exit 1 ;;
          esac

      - name: Verify audit logs fail closed without verified identity
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "$BASE_URL/api/v1/audit/logs" || true)"
          case "$status" in
            401|403|503) echo "LIVE_AUDIT_DENIAL_PASS: unauthenticated /api/v1/audit/logs returned HTTP $status" ;;
            *) echo "LIVE_AUDIT_DENIAL_FAILED: unauthenticated /api/v1/audit/logs returned HTTP $status"; exit 1 ;;
          esac
