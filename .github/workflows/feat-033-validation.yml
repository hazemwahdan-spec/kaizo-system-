name: FEAT-033 Validation
on:
  pull_request:
    paths:
      - "backend/decision_drill_selection.py"
      - "backend/test_feat_033_decision_drill_selection.py"
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Acceptance
        working-directory: backend
        run: python -m unittest test_feat_033_decision_drill_selection.py
