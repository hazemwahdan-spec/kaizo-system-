name: Cloudflare Free Memory-only Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Verify credentials and memory-only Staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "hazemwahdan-spec/kaizo-system-" || { echo "Unexpected repository"; exit 1; }
          test "$GITHUB_REF_NAME" = "fix/cloudflare-free-memory-staging-20261119" || { echo "Staging-only branch guard rejected this ref"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("wrangler.jsonc").read_text())
          assert config.get("name") == "kaizo-coach-core-staging", "Unexpected Worker name"
          assert config.get("main") == "cloudflare_worker.py", "Unexpected Worker entrypoint"
          vars_ = config.get("vars", {})
          assert vars_.get("KAIZO_ENVIRONMENT") == "staging", "Staging environment is required"
          assert vars_.get("KAIZO_PERSISTENCE_MODE") == "memory", "Memory-only persistence is required"
          assert not config.get("hyperdrive"), "Hyperdrive is forbidden in free memory-only Staging"
          print("PASS: isolated Worker name, staging environment, memory persistence, no Hyperdrive")
          PY
      - name: Install Python 3.13 Worker dependencies
        run: |
          uv python install 3.13
          uv sync --dev --no-install-project --python 3.13
      - name: Build and validate Worker without deployment
        shell: bash
        run: |
          set -euo pipefail
          mv requirements.txt "$RUNNER_TEMP/kaizo-root-requirements.txt"
          trap 'mv "$RUNNER_TEMP/kaizo-root-requirements.txt" requirements.txt' EXIT
          uv run --no-sync --python 3.13 pywrangler deploy --dry-run
      - name: Deploy isolated memory-only Staging Worker
        shell: bash
        run: |
          set -euo pipefail
          mv requirements.txt "$RUNNER_TEMP/kaizo-root-requirements.txt"
          trap 'mv "$RUNNER_TEMP/kaizo-root-requirements.txt" requirements.txt' EXIT
          uv run --no-sync --python 3.13 pywrangler deploy
