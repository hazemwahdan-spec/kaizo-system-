name: Cloudflare Free Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KAIZO_STAGING_HYPERDRIVE_ID: ${{ vars.KAIZO_STAGING_HYPERDRIVE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Verify Cloudflare and isolated Staging bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          if ! [[ "$KAIZO_STAGING_HYPERDRIVE_ID" =~ ^[a-f0-9]{32}$ ]]; then
            echo "Missing or invalid KAIZO_STAGING_HYPERDRIVE_ID repository variable."
            exit 1
          fi
      - name: Bind the pre-created Staging-only Hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("wrangler.jsonc")
          config = json.loads(path.read_text())
          config["hyperdrive"] = [{
              "binding": "HYPERDRIVE",
              "id": os.environ["KAIZO_STAGING_HYPERDRIVE_ID"]
          }]
          path.write_text(json.dumps(config, indent=2) + "\\n")
          PY
      - name: Install Python Worker dependencies
        run: |
          uv python install 3.13
          uv sync --dev --no-install-project --python 3.13
      - name: Deploy PostgreSQL-backed Staging Worker
        shell: bash
        run: |
          set -euo pipefail
          mv requirements.txt "$RUNNER_TEMP/kaizo-root-requirements.txt"
          trap 'mv "$RUNNER_TEMP/kaizo-root-requirements.txt" requirements.txt' EXIT
          uv run --no-sync --python 3.13 pywrangler deploy
