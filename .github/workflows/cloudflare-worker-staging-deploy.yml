name: Cloudflare Free Staging Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Install Python Worker dependencies
        run: |
          uv python install 3.13
          uv sync --dev --no-install-project --python 3.13
      - name: Deploy isolated in-memory staging Worker
        shell: bash
        run: |
          set -euo pipefail
          mv requirements.txt "$RUNNER_TEMP/kaizo-root-requirements.txt"
          trap 'mv "$RUNNER_TEMP/kaizo-root-requirements.txt" requirements.txt' EXIT
          uv run --no-sync --python 3.13 pywrangler deploy
