name: Neon Read-Only Connectivity Validation

on:
  workflow_dispatch:
    inputs:
      target_confirmation:
        description: Confirm this is a dedicated isolated Neon branch with a read-only database role
        required: true
        type: choice
        options:
          - NO
          - NEON_ISOLATED_READ_ONLY

permissions:
  contents: read

jobs:
  neon-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: neon-readonly-validation
    env:
      TARGET_CONFIRMATION: ${{ inputs.target_confirmation }}
      NEON_READONLY_DATABASE_URL: ${{ secrets.KAIZO_NEON_READONLY_URL }}
    steps:
      - name: Require isolated target and dedicated secret
        shell: bash
        run: |
          if [ "$TARGET_CONFIRMATION" != "NEON_ISOLATED_READ_ONLY" ]; then
            echo "Stopped: isolated Neon target was not explicitly confirmed."
            exit 1
          fi
          if [ -z "$NEON_READONLY_DATABASE_URL" ]; then
            echo "Stopped: configure KAIZO_NEON_READONLY_URL in the neon-readonly-validation environment."
            exit 1
          fi

      - name: Set Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PostgreSQL client
        run: python -m pip install "psycopg[binary]==3.2.3"

      - name: Verify Neon connection in read-only transaction
        env:
          DATABASE_URL: ${{ secrets.KAIZO_NEON_READONLY_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          dsn = os.environ["DATABASE_URL"]
          with psycopg.connect(dsn, connect_timeout=8, sslmode="require") as conn:
              with conn.cursor() as cur:
                  cur.execute("SET TRANSACTION READ ONLY")
                  cur.execute("SET LOCAL statement_timeout = '10000ms'")
                  cur.execute("""
                      SELECT current_database(),
                             current_user,
                             current_setting('transaction_read_only'),
                             current_setting('server_version')
                  """)
                  database, role, read_only, version = cur.fetchone()
                  if read_only != "on":
                      raise SystemExit("Safety stop: transaction is not read-only")

                  cur.execute("""
                      SELECT r.rolsuper,
                             has_database_privilege(current_user, current_database(), 'CREATE'),
                             has_schema_privilege(current_user, 'public', 'CREATE')
                      FROM pg_roles AS r
                      WHERE r.rolname = current_user
                  """)
                  privileges = cur.fetchone()
                  if privileges is None or any(privileges):
                      raise SystemExit("Safety stop: database role has elevated write privileges")

                  cur.execute("""
                      SELECT to_regclass('public.kaizo_knowledge_repository') IS NOT NULL
                  """)
                  knowledge_table_present = cur.fetchone()[0]
                  print({
                      "connection": "ok",
                      "database": database,
                      "role": role,
                      "transaction_read_only": read_only,
                      "server_version": version,
                      "role_superuser": privileges[0],
                      "database_create": privileges[1],
                      "public_schema_create": privileges[2],
                      "knowledge_repository_table_present": knowledge_table_present,
                      "data_mutations": "none",
                      "schema_mutations": "none",
                  })
              conn.rollback()
          PY
