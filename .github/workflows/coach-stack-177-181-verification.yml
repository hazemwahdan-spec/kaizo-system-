name: Coach Stack 177-181 Verification

on:
  push:
    branches:
      - verify/coach-stack-177-181
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-stack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaizo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaizo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KAIZO_PERSISTENCE_MODE: postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaizo_test
      PYTHONPATH: .:backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest httpx2
      - name: Compile backend and productization modules
        run: python -m compileall -q backend productization
      - name: Verify Coach groups security in memory adapter and UI contracts
        run: |
          KAIZO_PERSISTENCE_MODE=memory pytest -q productization/test_coach_groups_security.py frontend/test_product_ui_contract.py
      - name: Verify Coach groups PostgreSQL durability and tenant audit
        run: |
          pytest -q productization/test_coach_groups_postgres.py
      - name: Verify athlete lifecycle ownership and PostgreSQL durability
        run: |
          pytest -q productization/test_coach_athlete_lifecycle.py productization/test_coach_athlete_lifecycle_postgres.py
      - name: Verify decision history ownership and PostgreSQL durability
        run: |
          pytest -q productization/test_coach_athlete_decision_history.py productization/test_coach_athlete_decision_history_postgres.py
      - name: Verify Coach dashboard memory isolation
        run: |
          KAIZO_PERSISTENCE_MODE=memory pytest -q productization/test_coach_home_dashboard.py
      - name: Verify Coach dashboard PostgreSQL tenant isolation
        run: |
          pytest -q productization/test_coach_home_dashboard_postgres.py
      - name: Verify priority queue API, evidence scope, and PostgreSQL durability
        run: |
          pytest -q productization/test_coach_priority_queue.py productization/test_coach_priority_queue_api.py productization/test_coach_priority_queue_postgres.py
      - name: Verify shared product surface contracts
        run: |
          pytest -q productization/test_product_surface_contract.py frontend/test_product_ui_contract.py
