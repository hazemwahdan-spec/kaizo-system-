name: FEAT-047 Validation
on:
  pull_request:
    paths: [backend/source_provenance_linkage.py, backend/test_feat_047_source_provenance_linkage.py]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest test_feat_047_source_provenance_linkage.py
        working-directory: backend
