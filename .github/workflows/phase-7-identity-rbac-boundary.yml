name: Phase 7 Identity RBAC Boundary

on:
  push:
    branches: [phase-7-identity-rbac-runtime-boundary]
  pull_request:
    branches: [main]

jobs:
  identity-boundary:
    runs-on: ubuntu-latest
    env:
      KAIZO_IDENTITY_MODE: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install fastapi pydantic pytest httpx2
      - name: Validate identity boundary
        run: python -m pytest productization/test_identity.py productization/test_product_api.py productization/test_product_surface.py -q
