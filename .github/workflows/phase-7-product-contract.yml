name: Phase 7 Product Contract

on:
  pull_request:
    paths:
      - "productization/**"
      - ".github/workflows/phase-7-product-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Validate Coach decision and adaptation ownership
        working-directory: backend
        env:
          PYTHONPATH: ..
          KAIZO_IDENTITY_MODE: development
        run: pytest -q ../productization/test_product_api.py ../productization/test_runtime_adapter.py
      - name: Validate role contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("productization/role-contract.json")
          data = json.loads(p.read_text())
          assert data["execution_authorized_default"] is False
          assert set(data["roles"]) == {"academy", "coach", "athlete", "parent"}
          assert "execution_authorized=true" in data["global_denials"]
          for role, spec in data["roles"].items():
              assert spec["purpose"]
              assert spec["can_request"]
              assert spec["cannot"]
              assert any("authorize_execution" in x or "execution" in x for x in spec["cannot"])
          print("PHASE_7_PRODUCT_CONTRACT_PASS")
          PY
