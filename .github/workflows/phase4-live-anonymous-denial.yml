name: Phase 4 Live Anonymous Denial

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/phase4-live-anonymous-denial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify known protected Core endpoints deny anonymous access
        shell: bash
        run: |
          set -euo pipefail
          base="https://kaizo-system.fastapicloud.dev"
          failed=0
          # These paths are present in the current Phase 4 runtime smoke contract.
          # Do not count 404 as authorization evidence: it means the route was not exercised.
          for route in "/api/v1/audit/logs" "/api/v1/evidence" "/api/v1/evidence/phase4-anonymous-probe"; do
            status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "$base$route" || true)"
            case "$status" in
              401|403|503) echo "ANONYMOUS_DENIAL_PASS $route HTTP $status" ;;
              *) echo "ANONYMOUS_DENIAL_FAIL $route HTTP $status (expected 401, 403, or 503; 404 is not proof)"; failed=1 ;;
            esac
          done
          if [[ "$failed" != "0" ]]; then
            exit 1
          fi

      - name: Verify public health remains available
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "https://kaizo-system.fastapicloud.dev/api/v1/health" || true)"
          test "$status" = "200" || { echo "HEALTH_FAIL HTTP $status"; exit 1; }
          echo "HEALTH_PASS HTTP $status"
