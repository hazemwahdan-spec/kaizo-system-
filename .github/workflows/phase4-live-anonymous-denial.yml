name: Phase 4 Live Anonymous Denial

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/phase4-live-anonymous-denial.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify protected Core reads deny anonymous access
        shell: bash
        run: |
          set -euo pipefail
          base="https://kaizo-system.fastapicloud.dev"
          failed=0
          for route in             "/api/v1/audit/logs"             "/api/v1/athletes/phase4-anonymous-probe"             "/api/v1/assessments/phase4-anonymous-probe"             "/api/v1/decision-candidates/phase4-anonymous-probe/rationale"             "/api/v1/evidence"; do
            status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "$base$route" || true)"
            case "$status" in
              401|403|503) echo "DENIAL_PASS $route HTTP $status" ;;
              *) echo "DENIAL_FAIL $route HTTP $status"; failed=1 ;;
            esac
          done
          test "$failed" -eq 0

      - name: Verify public health remains available
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --connect-timeout 10 --max-time 25 -o /dev/null -w "%{http_code}" "https://kaizo-system.fastapicloud.dev/api/v1/health" || true)"
          test "$status" = "200" || { echo "HEALTH_FAIL HTTP $status"; exit 1; }
          echo "HEALTH_PASS HTTP $status"
