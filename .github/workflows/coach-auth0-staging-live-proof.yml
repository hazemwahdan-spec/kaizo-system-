name: Coach Auth0 Staging Live Proof

on:
  workflow_dispatch:
    inputs:
      owned_athlete_id:
        description: Existing disposable athlete owned by the Auth0 Coach test account
        required: true
        type: string
      foreign_coach_athlete_id:
        description: Disposable athlete owned by a different Coach in the same tenant
        required: true
        type: string
      foreign_tenant_athlete_id:
        description: Disposable athlete owned by a Coach in a different tenant
        required: true
        type: string

permissions:
  contents: read

jobs:
  auth0-coach-live-proof:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      KAIZO_STAGING_API_URL: ${{ vars.KAIZO_STAGING_API_URL }}
      KAIZO_STAGING_API_HOST: ${{ vars.KAIZO_STAGING_API_HOST }}
      KAIZO_PRODUCTION_API_HOST: ${{ vars.KAIZO_PRODUCTION_API_HOST }}
      KAIZO_STAGING_OWNED_ATHLETE_ID: ${{ inputs.owned_athlete_id }}
      KAIZO_STAGING_FOREIGN_COACH_ATHLETE_ID: ${{ inputs.foreign_coach_athlete_id }}
      KAIZO_STAGING_FOREIGN_TENANT_ATHLETE_ID: ${{ inputs.foreign_tenant_athlete_id }}
      KAIZO_OIDC_BEARER_TOKEN: ${{ secrets.KAIZO_OIDC_BEARER_TOKEN }}
      KAIZO_OIDC_NO_PRODUCT_TOKEN: ${{ secrets.KAIZO_OIDC_NO_PRODUCT_TOKEN }}
      KAIZO_OIDC_NONCOACH_TOKEN: ${{ secrets.KAIZO_OIDC_NONCOACH_TOKEN }}
      KAIZO_OIDC_WRONG_AUDIENCE_TOKEN: ${{ secrets.KAIZO_OIDC_WRONG_AUDIENCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require Auth0 Staging test token
        shell: bash
        run: |
          required_secrets=(KAIZO_OIDC_BEARER_TOKEN KAIZO_OIDC_NO_PRODUCT_TOKEN KAIZO_OIDC_NONCOACH_TOKEN KAIZO_OIDC_WRONG_AUDIENCE_TOKEN)
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name}" ]; then
              echo "$secret_name repository secret is required for complete negative-authorization coverage."
              exit 1
            fi
          done
      - name: Run live Auth0 Coach authorization checks (GET only)
        run: python scripts/verify_coach_auth0_staging.py
