name: FEAT-033-040 End-to-End Validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  training-workflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi pydantic httpx pytest PyJWT[crypto]
      - name: Run FEAT-033..040 semantic and ownership security tests
        env:
          KAIZO_IDENTITY_MODE: development
          KAIZO_PERSISTENCE_MODE: memory
        run: pytest -q test_training_workflow.py
