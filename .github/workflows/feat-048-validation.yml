name: FEAT-048 Validation
on:
  pull_request:
    paths: [backend/knowledge_lifecycle_status.py, backend/test_feat_048_knowledge_lifecycle_status.py]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m unittest test_feat_048_knowledge_lifecycle_status.py
        working-directory: backend
