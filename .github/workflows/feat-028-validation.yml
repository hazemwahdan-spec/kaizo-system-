name: FEAT-028 Acceptance

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/main.py"
      - "backend/persistence.py"
      - "backend/test_feat_028_dosage_reps_sets.py"
      - ".github/workflows/feat-028-validation.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kaizo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaizo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install pytest
        run: pip install pytest
      - name: Run FEAT-028 acceptance
        working-directory: backend
        env:
          KAIZO_PERSISTENCE_MODE: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaizo_test
        run: PYTHONPATH=.. pytest -q test_feat_028_dosage_reps_sets.py
