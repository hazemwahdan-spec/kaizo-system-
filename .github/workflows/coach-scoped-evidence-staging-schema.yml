name: Coach Scoped Evidence Staging Schema

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-staging-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      KAIZO_ENVIRONMENT: staging
      KAIZO_PERSISTENCE_MODE: postgres
      DATABASE_URL: ${{ secrets.KAIZO_STAGING_DATABASE_URL }}
      KAIZO_STAGING_DB_HOST: ${{ vars.KAIZO_STAGING_DB_HOST }}
      KAIZO_PRODUCTION_DB_HOST: ${{ vars.KAIZO_PRODUCTION_DB_HOST }}
      PYTHONPATH: backend:.
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Require allowlisted Staging database target
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$KAIZO_STAGING_DB_HOST" ] || [ -z "$KAIZO_PRODUCTION_DB_HOST" ]; then
            echo "KAIZO_STAGING_DATABASE_URL secret plus KAIZO_STAGING_DB_HOST and KAIZO_PRODUCTION_DB_HOST repository variables are required."
            exit 1
          fi
      - name: Apply additive Coach evidence schema to Staging only
        run: python scripts/apply_coach_scoped_evidence_staging_schema.py
