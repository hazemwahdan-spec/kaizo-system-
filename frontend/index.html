<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KAIZO SYSTEM — Commercial Product</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <script>
  (function () {
    function loadScript(src) {
      return new Promise(function (resolve, reject) {
        var script = document.createElement("script");
        script.src = src;
        script.crossOrigin = "anonymous";
        script.onload = resolve;
        script.onerror = function () {
          script.remove();
          reject(new Error("Script failed to load: " + src));
        };
        document.head.appendChild(script);
      });
    }

    function sdkFactory() {
      if (typeof window.createAuth0Client === "function") return window.createAuth0Client;
      if (window.auth0 && typeof window.auth0.createAuth0Client === "function") {
        return window.auth0.createAuth0Client.bind(window.auth0);
      }
      return null;
    }

    (async function () {
      var failures = [];
      var sources = [
        "https://cdn.auth0.com/js/auth0-spa-js/2.27/auth0-spa-js.production.js",
        "https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2.27.0/dist/auth0-spa-js.production.js"
      ];
      for (var i = 0; i < sources.length; i++) {
        try {
          await loadScript(sources[i]);
          if (sdkFactory()) break;
          failures.push(sources[i] + " loaded but did not expose createAuth0Client");
        } catch (error) {
          failures.push(String(error && error.message || error));
        }
      }
      if (!sdkFactory()) {
        window.KAIZO_AUTH_SDK_LOAD_ERROR = failures.join(" | ") || "No Auth0 SDK factory was exposed.";
      } else {
        window.createAuth0Client = sdkFactory();
      }

      await loadScript("./auth-config.js");
      await loadScript("./auth.js");
      await loadScript("./app.js");
    })().catch(function (error) {
      window.KAIZO_BOOT_ERROR = String(error && error.message || error);
      var app = document.getElementById("app");
      if (app) app.textContent = "KAIZO failed to initialize. Reload the page and inspect the runtime diagnostic.";
    });
  })();
  </script>
</body>
</html>
